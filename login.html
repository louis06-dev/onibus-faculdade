<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Login</title>
<link rel="stylesheet" href="estilo.css">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>

<div class="card">
  <h1>ONE - BUS</h1>
  <h5>PROJETO INTEGRADOR 2026</h5>

  <input
  type="text"
  id="login"
  placeholder="CPF"
  maxlength="11"
  
  autocomplete="off"
>
  <input id="senha" type="password" placeholder="Senha">
 <p
  id="toggleSenha"
  onclick="mostrarSenha()"
  style="
    cursor:pointer;
    font-size:14px;
    color:#7fbfff;
    text-align:right;
    margin-top:6px;
    margin-bottom:10px;
    user-select:none;
  "
>
  👁 Mostrar senha
</p>

  <button onclick="login()">Entrar</button>

  <p>Não possui conta? <a href="cadastro.html">Cadastrar</a></p>
  <p id="msg"></p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
<script src="auth.js"></script>
</body>
</html>
