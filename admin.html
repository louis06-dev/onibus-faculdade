<!DOCTYPE html>
<html lang="pt-br">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Painel do Motorista</title>

<link rel="stylesheet" href="estilo.css">

<style>

.painel-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:20px;
}

@media(max-width:800px){

  .painel-grid{
    grid-template-columns:1fr;
  }
}

.status{
  padding:6px 10px;
  border-radius:8px;
  display:inline-block;
  margin-top:8px;
  font-weight:bold;
}

.aguardando_ida,
.aguardando_volta{
  background:#fff3cd;
}

.embarcou_ida,
.embarcado_volta{
  background:#d4edda;
}

.nao_volta{
  background:#f8d7da;
}

.cheguei_casa,
.chegou_faculdade{
  background:#d1ecf1;
}

.card-aluno{
  border:1px solid #ddd;
  border-radius:10px;
  padding:15px;
  margin-bottom:15px;
}

.topo{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.nome{
  font-size:18px;
  font-weight:bold;
}

.info{
  margin-top:8px;
}

</style>

</head>

<body>

<div class="card">

  <h2>Painel do Motorista 🚌</h2>

  <a href="motorista-ida.html">
    <button>
      🚍 Painel da Ida
    </button>
  </a>

  <br><br>

  <a href="motorista-volta.html">
    <button>
      🏠 Painel da Volta
    </button>
  </a>

  <br><br>

  <button onclick="logout()">
    Sair
  </button>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<script src="auth.js"></script>

<script>

async function carregarPresencasAdmin(){

  const { data: sessionData } =
    await supabaseClient.auth.getSession();

  if(!sessionData.session){

    window.location.href = "login.html";

    return;
  }

  const listaIda =
    document.getElementById("listaIda");

  const listaVolta =
    document.getElementById("listaVolta");

  listaIda.innerHTML = "Carregando...";
  listaVolta.innerHTML = "Carregando...";

  // buscar presenças
  const hoje = new Date()
  .toISOString()
  .split("T")[0];

const { data: presencas, error } =
  await supabaseClient
    .from("presencas")
    .select("*")
    .gte("data_presenca", hoje)
    .order("data_presenca", {
      ascending:false
    });

  if(error){

    listaIda.innerHTML =
      "Erro ao carregar";

    listaVolta.innerHTML =
      "Erro ao carregar";

    console.log(error);

    return;
  }

  // buscar usuários
  const { data: usuarios } =
    await supabaseClient
      .from("usuarios")
      .select("id, nome, telefone, instituicao");

  if(!presencas || presencas.length === 0){

    listaIda.innerHTML =
      "<p>Nenhuma presença encontrada.</p>";

    listaVolta.innerHTML =
      "<p>Nenhuma presença encontrada.</p>";

    return;
  }

  listaIda.innerHTML = "";
  listaVolta.innerHTML = "";

  presencas.forEach(p => {

    const usuario =
      usuarios.find(u =>
        u.id === p.user_id
      );

    // ================= IDA =================

    const statusIda =
      p.status_ida || "aguardando_ida";

    const nomesIda = {

      aguardando_ida:
        "⏳ Aguardando ida",

      embarcou_ida:
        "🚌 Embarcou",

      chegou_faculdade:
        "🏫 Chegou na faculdade"
    };

    const divIda =
      document.createElement("div");

    divIda.className =
      "card-aluno";

    divIda.innerHTML = `

      <div class="topo">

        <div class="nome">
          ${usuario?.nome || "Aluno"}
        </div>

      </div>

      <div class="info">
        ☎️
        <a
          href="https://wa.me/55${usuario?.telefone}"
          target="_blank"
        >
          ${usuario?.telefone || "-"}
        </a>
      </div>

      <div class="info">
        🏫 ${usuario?.instituicao || "-"}
      </div>

      <div class="status ${statusIda}">
        ${nomesIda[statusIda]}
      </div>

    `;

    listaIda.appendChild(divIda);

    // ================= VOLTA =================

    const statusVolta =
      p.status_volta || "aguardando_volta";

    const nomesVolta = {

      aguardando_volta:
        "⏳ Aguardando volta",

      embarcado_volta:
        "🚌 Embarcou",

      nao_volta:
        "❌ Não volta",

      cheguei_casa:
        "🏠 Chegou em casa"
    };

    const divVolta =
      document.createElement("div");

    divVolta.className =
      "card-aluno";

    divVolta.innerHTML = `

      <div class="topo">

        <div class="nome">
          ${usuario?.nome || "Aluno"}
        </div>

      </div>

      <div class="info">
        ☎️
        <a
          href="https://wa.me/55${usuario?.telefone}"
          target="_blank"
        >
          ${usuario?.telefone || "-"}
        </a>
      </div>

      <div class="info">
        🏫 ${usuario?.instituicao || "-"}
      </div>

      <div class="status ${statusVolta}">
        ${nomesVolta[statusVolta]}
      </div>

    `;

    listaVolta.appendChild(divVolta);

  });

}

carregarPresencasAdmin();

// atualiza sozinho
setInterval(
  carregarPresencasAdmin,
  60000
);

</script>

</body>
</html>
