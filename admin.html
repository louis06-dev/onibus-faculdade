<!DOCTYPE html>
<html lang="pt-br">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Painel do Motorista</title>

<link rel="stylesheet" href="estilo.css">

<style>

.status{
  padding:6px 10px;
  border-radius:8px;
  display:inline-block;
  margin-top:8px;
  font-weight:bold;
}

.aguardando{
  background:#fff3cd;
}

.embarcado{
  background:#d4edda;
}

.nao_volta{
  background:#f8d7da;
}

.cheguei{
  background:#d1ecf1;
}

.card-aluno{
  border:1px solid #ddd;
  border-radius:10px;
  padding:15px;
  margin-bottom:15px;
}

.topo{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.nome{
  font-size:18px;
  font-weight:bold;
}

.info{
  margin-top:8px;
}

</style>

</head>

<body>

<div class="card">

  <h2>Painel do Motorista 🚌</h2>

  <div id="resumo"></div>

  <hr>

  <div id="lista">
    Carregando...
  </div>

  <br>

  <button onclick="logout()">
    Sair
  </button>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<script src="auth.js"></script>

<script>

async function carregarPresencasAdmin(){

  const { data: sessionData } =
    await supabaseClient.auth.getSession();

  if(!sessionData.session){

    window.location.href = "login.html";

    return;
  }

  const lista =
    document.getElementById("lista");

  lista.innerHTML = "Carregando...";

  // busca presenças
  const { data: presencas, error } =
    await supabaseClient
      .from("presencas")
      .select("*")
      .order("data_presenca", {
        ascending:false
      });

  if(error){

    lista.innerHTML =
      "Erro ao carregar";

    console.log(error);

    return;
  }

  // busca usuários
  const { data: usuarios } =
    await supabaseClient
      .from("usuarios")
      .select("id, nome, telefone, instituicao");

  if(!presencas || presencas.length === 0){

    lista.innerHTML =
      "<p>Nenhuma presença encontrada.</p>";

    return;
  }

  // resumo
  const aguardando =
    presencas.filter(p =>
      p.status_retorno === "aguardando"
    ).length;

  const embarcado =
    presencas.filter(p =>
      p.status_retorno === "embarcado"
    ).length;

  document.getElementById("resumo").innerHTML = `

    <p>⏳ Aguardando:
      <b>${aguardando}</b>
    </p>

    <p>🚌 Embarcados:
      <b>${embarcado}</b>
    </p>

  `;

  lista.innerHTML = "";

  presencas.forEach(p => {

    const usuario =
      usuarios.find(u =>
        u.id === p.user_id
      );

    const status =
      p.status_retorno || "aguardando";

    const nomes = {

      aguardando:
        "⏳ Aguardando ônibus",

      embarcado:
        "🚌 Embarcado",

      nao_volta:
        "❌ Não retorna de ônibus",

      cheguei:
        "🏠 Chegou em casa"
    };

    const div =
      document.createElement("div");

    div.className =
      "card-aluno";

    div.innerHTML = `

      <div class="topo">

        <div class="nome">
          ${usuario?.nome || "Aluno"}
        </div>

        <div>
          📅 ${p.data_presenca}
        </div>

      </div>

      <div class="info">
        ☎️ Telefone:    
  <a
    href="https://wa.me/55${usuario?.telefone}"
    target="_blank"
  >
    ${usuario?.telefone || "-"}
  </a>

</div>

      <div class="info">
        🏫 Instituição: ${usuario?.instituicao || "-"}
      </div>
      
      
      <div class="status ${status}">
        ${nomes[status]}
      </div>

    `;

    lista.appendChild(div);
  });
}

carregarPresencasAdmin();

// atualiza sozinho a cada 10 segundos
setInterval(
  carregarPresencasAdmin,
  60000
);

</script>

</body>
</html>
